name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --python ${{ matrix.python-version }}
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ty check
        if: matrix.python-version == '3.13'
      - run: uv run --locked pytest
      - name: Build and verify the plugin archive
        run: |
          uv run --locked python scripts/build_zipapp.py \
            --output plugins/shim-cli/bin/shim.pyz
          test -x plugins/shim-cli/bin/shim.pyz
          # With no Python, the prompt is withheld with the hook's own block.
          test "$(printf '%s' '{"hook_event_name":"UserPromptSubmit","prompt":"Contact alice@example.com"}' \
            | env -i PATH=/nonexistent CLAUDE_PLUGIN_ROOT="$PWD/plugins/shim-cli" \
              plugins/shim-cli/hooks/run-shim claude prompt 2>/dev/null)" \
            = "$(uv run --locked python -c 'import sys; from shim_cli.hook import _error_output; sys.stdout.buffer.write(_error_output("claude"))')"
          test "$(env -i PATH="$(dirname "$(command -v python)"):/usr/bin:/bin" HOME="$HOME" \
            CLAUDE_PLUGIN_ROOT="$PWD/plugins/shim-cli" \
            plugins/shim-cli/hooks/run-shim claude \
            <<< '{"hook_event_name":"UserPromptSubmit","prompt":"Contact alice@example.com"}')" \
            = '{"systemMessage":"shim: found EMAIL (1) in your prompt. Not modified."}'
      - run: uv build --no-build-isolation
      - name: Export locked package-test dependencies
        run: |
          uv export --locked --no-dev --no-emit-project --output-file /tmp/shim-runtime.lock
          uv export --locked --only-dev --no-emit-project --output-file /tmp/shim-dev.lock
      - name: Check wheel contents
        run: |
          python -c 'from pathlib import Path; from zipfile import ZipFile; wheel = next(Path("dist").glob("*.whl")); names = ZipFile(wheel).namelist(); assert "shim_cli/__init__.py" in names; assert "shim_cli/guard/suffixes.py" in names; assert any(name.endswith(".dist-info/METADATA") for name in names)'
      - name: Verify no NLP dependency is declared
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheel = next(Path("dist").glob("*.whl"))
          names = ZipFile(wheel).namelist()
          metadata = next(n for n in names if n.endswith(".dist-info/METADATA"))
          text = ZipFile(wheel).read(metadata).decode()
          for banned in ("presidio", "tldextract", "spacy"):
              assert banned not in text.lower(), f"{banned} is still a dependency"
          print("no NLP dependency declared")
          PY
      - name: Verify packaged wheel contracts and gate hook latency
        run: |
          uv venv --python ${{ matrix.python-version }} /tmp/shim-cli-wheel
          uv pip install --python /tmp/shim-cli-wheel --require-hashes -r /tmp/shim-runtime.lock -r /tmp/shim-dev.lock
          uv pip install --python /tmp/shim-cli-wheel --no-deps dist/*.whl
          /tmp/shim-cli-wheel/bin/shim --help
          test -x /tmp/shim-cli-wheel/bin/shim-hook
          test -z "$(printf '%s' '{"hook_event_name":"UserPromptSubmit","prompt":"Synthetic safe prompt"}' | /tmp/shim-cli-wheel/bin/shim-hook codex 2>&1)"
          /tmp/shim-cli-wheel/bin/shim demo codex --json
          /tmp/shim-cli-wheel/bin/python -I -B -m pytest tests/contracts/codex/test_hook.py
          /tmp/shim-cli-wheel/bin/python -I -B -m pytest tests/contracts/claude/test_claude_hook.py
          /tmp/shim-cli-wheel/bin/python -I -B -m pytest tests/contracts/test_import_hygiene.py
          python scripts/benchmark_hook.py --self-check
          python scripts/benchmark_hook.py /tmp/shim-cli-wheel/bin/python --samples-per-fixture 20 --output /tmp/shim-benchmark.json
          cat /tmp/shim-benchmark.json
      - name: Verify packaged source distribution contracts
        run: |
          uv venv --python ${{ matrix.python-version }} /tmp/shim-cli-sdist
          uv pip install --python /tmp/shim-cli-sdist --require-hashes -r /tmp/shim-runtime.lock -r /tmp/shim-dev.lock
          uv pip install --python /tmp/shim-cli-sdist --no-deps --no-build-isolation dist/*.tar.gz
          test -x /tmp/shim-cli-sdist/bin/shim-hook
          test -z "$(printf '%s' '{"hook_event_name":"UserPromptSubmit","prompt":"Synthetic safe prompt"}' | /tmp/shim-cli-sdist/bin/shim-hook codex 2>&1)"
          /tmp/shim-cli-sdist/bin/shim demo codex --json
          /tmp/shim-cli-sdist/bin/python -I -B -m pytest tests/contracts/codex/test_hook.py
          /tmp/shim-cli-sdist/bin/python -I -B -m pytest tests/contracts/claude/test_claude_hook.py

  archive-on-3-9:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: current
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - id: floor
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.9'
      - name: The committed archive answers identically on 3.9 and 3.13
        run: |
          set -eu
          config="$(mktemp -d)/config.toml"
          printf 'enabled_entities = ["EMAIL", "IBAN", "SECRET"]\n\n[mode]\nuser-prompt = "enforce"\n' > "$config"
          answer() {
            home="$(mktemp -d)"
            printf '%s' "$2" \
              | env TMPDIR="$home" SHIM_CONFIG="$config" \
                XDG_STATE_HOME="$home/state" \
                "$1" plugins/shim-cli/bin/shim.pyz claude 2>&1 \
              | sed -E "s|$home/shim-redacted-[A-Za-z0-9_]+\.txt|<REDACTED>|g" \
              | sed -E "s|[0-9]+ ms|N ms|g"
          }
          # Every fixture must leave the ASCII fast path in normalize(): an
          # ASCII-only set passed here while zip(strict=True) made 3.9 raise on
          # any Turkish letter or em dash.
          for fixture in \
            '{"hook_event_name":"UserPromptSubmit","prompt":"Hesap ışği: TR330006100519786457841326"}' \
            '{"hook_event_name":"PostToolUse","tool_name":"Read","tool_response":{"content":"kanit — AKIAIOSFODNN7EXAMPLE"}}' \
            '{"hook_event_name":"Stop","session_id":"s1","last_assistant_message":"bitti — alice@example.com"}'
          do
            diff \
              <(answer '${{ steps.floor.outputs.python-path }}' "$fixture") \
              <(answer '${{ steps.current.outputs.python-path }}' "$fixture")
          done
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Build a fresh archive from this commit
        run: |
          uv sync --locked --python '${{ steps.current.outputs.python-path }}'
          uv run --locked python scripts/build_zipapp.py --output "$RUNNER_TEMP/shim.pyz"
      - name: The fresh archive masks beside a lone surrogate on 3.9 and 3.13
        run: |
          set -eu
          # The committed archive is rebuilt only at release, so this branch's
          # hook reaches 3.9 only through a fresh build. -I -S: the archive must
          # carry its own dependencies, with nothing installed standing in.
          payload='{"hook_event_name":"PostToolUse","tool_name":"Bash","tool_input":{"command":"cat .env"},"tool_response":{"stdout":"key=AKIAIOSFODNN7EXAMPLE","stderr":"trunc \ud83d"}}'
          for python in '${{ steps.floor.outputs.python-path }}' '${{ steps.current.outputs.python-path }}'; do
            archive_tmp="$(mktemp -d)"
            printf '%s' "$payload" \
              | env TMPDIR="$archive_tmp" XDG_STATE_HOME="$archive_tmp/state" XDG_CONFIG_HOME="$archive_tmp/config" \
                "$python" -I -S -B "$RUNNER_TEMP/shim.pyz" claude > "$archive_tmp/out" 2> "$archive_tmp/err"
            test ! -s "$archive_tmp/err"
            "$python" -I - "$archive_tmp/out" <<'PY'
          import json, sys
          raw = open(sys.argv[1], "rb").read()
          output = json.loads(raw.decode("utf-8", "strict"))["hookSpecificOutput"]
          masked = {"stdout": "key=<SECRET_1>", "stderr": "trunc \ud83d"}
          assert output["updatedToolOutput"] == masked, output
          assert b"AKIAIOSFODNN7EXAMPLE" not in raw
          print("masked beside a lone surrogate:", sys.version.split()[0])
          PY
          done
  archive-follows-version:
    # The marketplace installs the plugin from main, so a shim.pyz rebuilt
    # without a release ships unreleased code to plugin users.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The plugin archive changes only with the version
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          if git diff --quiet "$BASE" HEAD -- plugins/shim-cli/bin/shim.pyz; then
            exit 0
          fi
          if git diff "$BASE" HEAD -- pyproject.toml | grep -q '^+version = '; then
            exit 0
          fi
          echo "plugins/shim-cli/bin/shim.pyz changed without a version change in pyproject.toml."
          echo "Only a release commit rebuilds the archive (CONTRIBUTING.md, The plugin archive)."
          exit 1
