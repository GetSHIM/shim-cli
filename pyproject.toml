[project]
name = "shim"
version = "1.0.2"
description = "Local traffic visibility and privacy controls for coding agents."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "shim Engineering" }]
keywords = [
  "claude-code", "codex", "github-copilot", "vscode", "coding-agents", "hooks",
  "pii", "pii-detection", "secrets", "redaction", "privacy", "llm",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development",
]
dependencies = [
  "phonenumbers==9.0.37",
  "rich==15.0.0",
  "tomli==2.3.0; python_version < '3.11'",
  "tomli-w==1.2.0",
  "typer==0.23.2",
]

[project.urls]
Homepage = "https://getshim.tech/products/shim-cli"
Repository = "https://github.com/GetSHIM/shim-cli"
Documentation = "https://github.com/GetSHIM/shim-cli#readme"
Issues = "https://github.com/GetSHIM/shim-cli/issues"
Changelog = "https://github.com/GetSHIM/shim-cli/tree/main/docs/releases"

[project.scripts]
shim = "shim_cli.cli.app:main"
shim-hook = "shim_cli.hook:main"

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10",
  "ruff>=0.15.22,<0.16",
  # Vendored for Python 3.10.
  "tomli==2.3.0",
  "ty>=0.0.65,<0.1",
  "uv-build==0.12.5",
]

[build-system]
requires = ["uv_build==0.12.5"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.12.5,<0.13"

[tool.uv.build-backend]
module-name = "shim_cli"
module-root = "src"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]


[tool.ty.src]
include = ["src"]
