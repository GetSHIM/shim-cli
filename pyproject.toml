[project]
name = "shim"
version = "0.3.1"
description = "shim-cli: local sensitive-data detection, prompt reporting, opt-in prompt blocking, verified Claude tool-event masking, and API-traffic watching"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "shim Engineering" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "phonenumbers==9.0.37",
  "rich==15.0.0",
  "tomli==2.3.0; python_version < '3.11'",
  "tomli-w==1.2.0",
  "typer==0.23.2",
]

[project.urls]
Homepage = "https://github.com/GetSHIM/shim-cli"
Repository = "https://github.com/GetSHIM/shim-cli"
Issues = "https://github.com/GetSHIM/shim-cli/issues"
Documentation = "https://github.com/GetSHIM/shim-cli#readme"

[project.scripts]
shim = "shim_cli.cli.app:main"
shim-hook = "shim_cli.hook:main"
shim-guard-hook = "shim_cli.hook:main"

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10",
  "ruff>=0.15.22,<0.16",
  # Vendored for Python 3.10.
  "tomli==2.3.0",
  "ty>=0.0.65,<0.1",
  "uv-build==0.12.5",
]

[build-system]
requires = ["uv_build==0.12.5"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.12.5,<0.13"

[tool.uv.build-backend]
module-name = ["shim_cli", "shim_guard"]
module-root = "src"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]


[tool.ty.src]
include = ["src"]
